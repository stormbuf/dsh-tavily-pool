# dsh-tavily-pool bundle patch: mount the plugin and pin both providers.
#
# ⚠️ `config` on an id-targeted patch REPLACES the whole config object
# (`cordis-plugin-include`'s `applyEntryPatches` does `target[key] = value` for
# every key of the patch, so assigning `config` discards the previous one
# entirely). Both provider fields must therefore be written out together:
# omitting one drops it from the composed row, silently reverting that
# capability to auto-selection instead of erroring. This is the exact mistake
# `dsh-tavily@0.3.1` shipped. Verified by running the host's own
# `applyEntryPatches` against the base row, and by `dsh --profile <p>
# --dump-config`: a patch writing only `searchProvider` loses `fetchProvider`.
#
# Both fields point at the single provider id `tavily`: the seam keeps search and
# fetch in two registries, and this plugin registers into both (ticket 01 for
# search, ticket 10 for fetch). Pinning an id that is not registered makes every
# call throw `WEB_PROVIDER_CONFIGURED_MISSING` — so a half-loaded plugin is a
# broken one, which is why `apply()` registers both providers before anything
# that can fail.
#
# To roll back by hand, point either field back at the official provider and keep
# BOTH lines present:
#   searchProvider: deepseek-official
#   fetchProvider: http
# See docs/usage.md ("Manual rollback").

- insert:
    - id: tavily-pool
      name: dsh-tavily-pool

- id: web
  config:
    searchProvider: tavily
    fetchProvider: tavily
